# Portainer: Stacks → Add stack → Repository 로 이 파일을 그대로 쓸 수 있습니다.
services:
  homeops:
    build: .
    image: homeops:latest
    pull_policy: build              # 다시 배포할 때마다 저장소 코드로 새로 빌드
    container_name: homeops
    restart: unless-stopped         # 웹 업데이트 후 자동으로 다시 시작하는 데 필요
    ports:
      - "8080:8080"
    volumes:
      - homeops-data:/app/data   # DB, 암호화 키, 백업 파일
    # 아래는 모두 선택 사항입니다. 계정과 연결 정보는 웹 화면에서 입력하세요.
    # environment:
    #   HOMEOPS_COOKIE_SECURE: "auto"   # auto | true | false
    #   HOMEOPS_BACKUP_KEEP: "10"       # Hubitat 백업 파일 보관 개수 (허브별)

volumes:
  homeops-data:
