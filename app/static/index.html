<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HomeOps</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="shell">
  <nav class="side" aria-label="주 메뉴">
    <a class="brand" href="#/integration">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><circle cx="12" cy="15" r="2"/></svg>
      <span><b>HomeOps</b><small>홈랩 · 스마트홈 통합 관리</small></span>
    </a>
    <div class="group"><span class="group-label">인프라</span>
      <a href="#/infra" data-route="infra">NAS · Proxmox · Portainer</a>
    </div>
    <div class="group"><span class="group-label">스마트홈 허브</span>
      <a href="#/hubs" data-route="hubs">허브 상태 · 수동 등록 · 역할</a>
    </div>
    <div class="group"><span class="group-label">스마트홈 연동</span>
      <a href="#/integration" data-route="integration">연동 경로 · 기기 제어</a>
    </div>
    <div class="side-foot">
      <a href="#/log" data-route="log">작업 기록</a>
      <button type="button" class="linklike" id="logout">로그아웃</button>
    </div>
  </nav>
  <main id="view" class="main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="하단 메뉴">
    <a href="#/integration" data-route="integration"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>연동</a>
    <a href="#/hubs" data-route="hubs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>허브</a>
    <a href="#/infra" data-route="infra"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="6" rx="1.5"/><rect x="3" y="13" width="18" height="6" rx="1.5"/></svg>인프라</a>
    <a href="#/log" data-route="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>기록</a>
  </nav>
</div>

<section id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1>HomeOps</h1>
    <p>홈랩 · 스마트홈 통합 관리</p>
    <label>아이디<input name="username" autocomplete="username" required></label>
    <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="login-err" role="alert"></p>
    <button type="submit" class="btn primary">로그인</button>
  </form>
</section>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
