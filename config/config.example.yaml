# HomeOps 연결 설정 예시
# 이 파일을 config.yaml 로 복사한 뒤 값을 채우세요. config.yaml 은 git에 올라가지 않습니다.
# 쓰지 않는 시스템은 항목을 지우면 화면에 "연결 전"으로 표시됩니다.

# Hubitat 허브 (여러 대)
# - maker_api: 허브의 Apps → Add Built-In App → Maker API 설치 후 App ID와 Access Token
#   ("Allow Access via Local IP Address" 켜기, 관리할 기기 선택)
# - login: 허브에 로그인 보안(Hub Login Security)을 켠 경우에만
hubitat:
  - id: main
    name: Hubitat Main
    role: 자동화 전용
    url: http://192.168.0.80
    maker_api:
      app_id: 0
      token: "MAKER_API_TOKEN"
    # login:
    #   username: admin
    #   password: "HUB_PASSWORD"
  - id: zigbee
    name: Hubitat Zigbee
    role: Zigbee 전용
    url: http://192.168.0.81
    maker_api:
      app_id: 0
      token: "MAKER_API_TOKEN"
  - id: matter
    name: Hubitat Matter
    role: Matter 전용
    url: http://192.168.0.82
    maker_api:
      app_id: 0
      token: "MAKER_API_TOKEN"

# Home Assistant: 프로필 → 보안 → 장기 액세스 토큰
home_assistant:
  url: http://192.168.0.x:8123
  token: "LONG_LIVED_ACCESS_TOKEN"
  verify_ssl: true

# Homebridge config-ui-x 로그인 계정
# 액세서리 목록·HB 배지는 Homebridge를 insecure 모드(-I)로 실행해야 보입니다.
homebridge:
  url: http://192.168.0.x:8581
  username: admin
  password: "HOMEBRIDGE_PASSWORD"

# Synology DSM: 2단계 인증이 없는 HomeOps 전용 계정 권장
synology:
  url: https://192.168.0.x:5001
  username: homeops
  password: "DSM_PASSWORD"
  verify_ssl: false   # 자체 서명 인증서면 false

# Proxmox VE: Datacenter → Permissions → API Tokens
# 권장 권한: VM.Audit, VM.PowerMgmt, VM.Snapshot, VM.Backup, Datastore.Audit, Datastore.AllocateSpace, Sys.Audit
proxmox:
  url: https://192.168.0.x:8006
  token_id: "homeops@pve!dashboard"
  token_secret: "TOKEN_SECRET_UUID"
  verify_ssl: false
  backup_storage: local

# Portainer: My account → Access tokens
portainer:
  url: https://192.168.0.x:9443
  api_key: "PORTAINER_ACCESS_TOKEN"
  verify_ssl: false

alerts:
  battery_warn: 30   # 이 값(%) 미만이면 "확인 필요"에 표시
